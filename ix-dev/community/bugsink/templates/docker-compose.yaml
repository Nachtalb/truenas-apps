{% set tpl = ix_lib.base.render.Render(values) %}

{% set bugsink_net = tpl.networks.create_internal("bugsink-net") %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The password goes into a URL, where the library writes a space as "+". #}
{% do tpl.funcs.disallow_chars(values.bugsink.db_password, [" "], "Database Password") %}
{# CREATE_SUPERUSER is "email:password", split on the first colon. #}
{% do tpl.funcs.disallow_chars(values.bugsink.admin_email, [":"], "Admin Email") %}

{% set pg_config = {
  "user": values.consts.db_user,
  "password": values.bugsink.db_password,
  "database": values.consts.db_name,
  "volume": values.storage.postgres_data,
} %}
{% set postgres = tpl.deps.postgres(values.consts.postgres_container_name, values.bugsink.postgres_image_selector, pg_config, perm_container) %}
{% do postgres.container.add_network(bugsink_net) %}

{% set c1 = tpl.add_container(values.consts.bugsink_container_name, "image") %}
{% do c1.add_network(bugsink_net) %}
{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.depends.add_dependency(values.consts.postgres_container_name, "service_healthy") %}
{# The image ships python with requests, but neither curl nor wget. #}
{% do c1.healthcheck.set_custom_test([
  "CMD", "python", "-c",
  "import requests; requests.get('http://127.0.0.1:%d/health/ready').raise_for_status()"|format(values.network.web_port.port_number),
]) %}
{# Migrations run before gunicorn starts, give the first start time to finish them. #}
{% do c1.healthcheck.set_start_period(120) %}

{% do c1.environment.add_env("PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("DATABASE_URL", postgres.get_url("postgresql")) %}
{% do c1.environment.add_env("SECRET_KEY", values.bugsink.secret_key) %}
{% do c1.environment.add_env("BASE_URL", values.bugsink.base_url.rstrip("/")) %}
{% do c1.environment.add_env("CREATE_SUPERUSER", "%s:%s"|format(values.bugsink.admin_email, values.bugsink.admin_password)) %}
{% do c1.environment.add_env("TIME_ZONE", values.TZ) %}
{% do c1.environment.add_user_envs(values.bugsink.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do postgres.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
